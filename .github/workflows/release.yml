name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python -c \
            'import json; print(json.load(open("custom_components/rti_ad/manifest.json"))["version"])')
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
