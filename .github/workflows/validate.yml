name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest rules change independently of this repo, so re-run weekly.
    - cron: "0 6 * * 1"

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          # The job status already reports the result; posting a PR comment
          # would need pull-requests: write.
          comment: "false"
          # The integration is not in home-assistant/brands, which is only
          # required for listing in the HACS default store. Drop this once
          # a brands PR is merged.
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master
