repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-format
        files: ^(custom_components|tests)/
      - id: ruff-check
        args: [--target-version, py314]
        files: ^(custom_components|tests)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # A local hook calling the repo's own venv, rather than the
        # mirrors-mypy hook, because custom_components/rti_ad4x imports
        # homeassistant types: mirrors-mypy's isolated hook environment
        # doesn't have homeassistant installed, so it can't resolve those
        # imports. Running the venv's own mypy (which has
        # pytest-homeassistant-custom-component's homeassistant pulled in
        # via requirements_test.txt) gives it what it needs.
        entry: .venv/bin/mypy custom_components/rti_ad4x
        language: system
        types: [python]
        files: ^custom_components/rti_ad4x/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(custom_components|tests)/
      - id: end-of-file-fixer
        files: ^(custom_components|tests)/
      - id: check-yaml
